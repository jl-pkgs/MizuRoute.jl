name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-tests:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. -e 'using MizuRoute; println("MizuRoute loaded successfully")'
      - run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'
      - name: Process coverage
        if: matrix.julia-version == '1.12'
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1.12'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: unittests
          name: julia-1.12
          use_oidc: true
          # Codecov currently reports "Repository not found" until the
          # jl-pkgs organization/repository is enabled on codecov.io.
          # Keep coverage generation/upload wired in without making CI red.
          fail_ci_if_error: false

  typst-docs:
    name: Typst documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'
      - working-directory: docs
        run: typst compile main.typ MizuRoute.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: MizuRoute-technical-documentation
          path: docs/MizuRoute.pdf
          if-no-files-found: error
